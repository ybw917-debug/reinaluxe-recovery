[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reinaluxe-recovery"
version = "0.1.0"
description = "AI-native SEO recovery and knowledge management system for ReinaLuxe"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Bowen Yuan" },
]
dependencies = [
  "alembic>=1.14,<2.0",
  "beautifulsoup4>=4.13,<5.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "rich>=13.0,<15.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
reinaluxe-recovery = "reinaluxe_recovery.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["reinaluxe_recovery*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unused_configs = true
